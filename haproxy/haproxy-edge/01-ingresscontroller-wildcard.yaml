# IngressController Custom Resource Patch
# Target: ingresscontroller/default in namespace openshift-ingress-operator
# 
# Pre-requisite:
# A TLS Secret named 'custom-wildcard-tls' must exist in the 'openshift-ingress' namespace:
#   oc create secret tls custom-wildcard-tls \
#     --cert=server.crt --key=server.key -n openshift-ingress
#
apiVersion: operator.openshift.io/v1
kind: IngressController
metadata:
  name: default
  namespace: openshift-ingress-operator
spec:
  defaultCertificate:
    name: custom-wildcard-tls

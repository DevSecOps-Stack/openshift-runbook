apiVersion: operator.openshift.io/v1
kind: IngressController
metadata:
  name: edge-app-ingress
  namespace: openshift-ingress-operator
spec:
  domain: edge-app.apps.okd-sno.brainybots.cloud
  replicas: 1
  endpointPublishingStrategy:
    type: HostNetwork
    hostNetwork:
      httpPort: 8080
      httpsPort: 8443
      statsPort: 1937
  defaultCertificate:
    name: custom-wildcard-tls
  # Scopes this dedicated ingress controller strictly to namespaces labeled ingress=edge-app
  namespaceSelector:
    matchLabels:
      ingress: edge-app

apiVersion: operator.openshift.io/v1
kind: IngressController
metadata:
  name: testapp-reencrypt-ingress
  namespace: openshift-ingress-operator
spec:
  domain: testapp-reencrypt.apps.okd-sno.brainybots.cloud
  replicas: 1
  defaultCertificate:
    name: reencrypt-wildcard-tls
  namespaceSelector:
    matchLabels:
      ingress: testapp-reencrypt
  endpointPublishingStrategy:
    type: LoadBalancerService
    loadBalancer:
      scope: External
